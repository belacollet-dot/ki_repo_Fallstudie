<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns="http://www.w3.org/1999/xhtml" lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${isNew} ? 'Wissenschaftler anlegen' : 'Wissenschaftler bearbeiten'">
        Formular
    </title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="true" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&amp;display=swap"
          rel="stylesheet" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg:            #f7f6f2;
            --surface:       #f9f8f5;
            --surface-2:     #fbfbf9;
            --border:        #d4d1ca;
            --divider:       #dcd9d5;
            --text:          #28251d;
            --text-muted:    #7a7974;
            --primary:       #01696f;
            --primary-hover: #0c4e54;
            --danger:        #a12c7b;
            --radius:        0.5rem;
            --radius-lg:     0.75rem;
            --shadow-sm:     0 1px 3px rgba(0,0,0,.06);
            --shadow-md:     0 4px 16px rgba(0,0,0,.1);
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 1rem;
            background: var(--bg);
            color: var(--text);
            min-height: 100dvh;
        }

        /* ── Header ── */
        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            gap: .75rem;
            box-shadow: var(--shadow-sm);
        }
        .brand-name  { font-size: 1.1rem; font-weight: 700; }
        .brand-badge {
            font-size: .75rem; background: var(--bg);
            color: var(--text-muted); border: 1px solid var(--border);
            border-radius: 999px; padding: 2px 10px;
        }

        /* ── Main ── */
        .main { max-width: 600px; margin: 2.5rem auto; padding: 0 1rem; }

        /* ── Breadcrumb ── */
        .breadcrumb {
            display: flex; align-items: center; gap: .5rem;
            font-size: .875rem; color: var(--text-muted); margin-bottom: 1.5rem;
        }
        .breadcrumb a { color: var(--primary); text-decoration: none; }
        .breadcrumb a:hover { text-decoration: underline; }

        /* ── Card ── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            padding: 2rem;
        }
        .card-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 1.75rem; }

        /* ── Form elements ── */
        .form-group { margin-bottom: 1.25rem; }
        label {
            display: block; font-size: .875rem; font-weight: 600;
            margin-bottom: .4rem;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        select {
            width: 100%; padding: .6rem .875rem;
            border: 1px solid var(--border); border-radius: var(--radius);
            font-size: .875rem; background: var(--surface-2); color: var(--text);
            transition: border-color 150ms ease, box-shadow 150ms ease;
            font-family: inherit;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(1, 105, 111, .12);
        }
        .hint { font-size: .78rem; color: var(--text-muted); margin-top: .35rem; }
        .field-error { color: var(--danger); font-size: .78rem; margin-top: .35rem; }

        /* ── Actions ── */
        .form-actions {
            display: flex; gap: .75rem; justify-content: flex-end;
            margin-top: 2rem; padding-top: 1.5rem;
            border-top: 1px solid var(--divider);
        }
        .btn {
            display: inline-flex; align-items: center; gap: .4rem;
            padding: .6rem 1.4rem; border-radius: var(--radius);
            font-size: .875rem; font-weight: 500; cursor: pointer;
            border: none; text-decoration: none;
            transition: background 150ms ease;
            font-family: inherit;
        }
        .btn-primary  { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-ghost    { background: transparent; color: var(--text-muted);
                        border: 1px solid var(--border); }
        .btn-ghost:hover { background: var(--bg); color: var(--text); }

        /* ── Alert ── */
        .alert {
            padding: .75rem 1rem; border-radius: var(--radius);
            font-size: .875rem; margin-bottom: 1.5rem;
        }
        .alert-error { background: #e0ced7; color: var(--danger);
                       border: 1px solid #d0b5c4; }
    </style>
</head>
<body>

<!-- ── Header ── -->
<header class="header">
    <span class="brand-name">LikeHeroToZero</span>
    <span class="brand-badge">Admin</span>
</header>

<!-- ── Main ── -->
<main class="main">

    <nav class="breadcrumb" aria-label="Breadcrumb">
        <a th:href="@{/admin/dashboard}">Dashboard</a>
        <span aria-hidden="true">›</span>
        <span th:text="${isNew} ? 'Neuer Wissenschaftler' : 'Bearbeiten'">Formular</span>
    </nav>

    <!-- Flash-Fehlermeldung (z.B. Validierungsfehler aus Redirect) -->
    <div th:if="${errorMessage}" class="alert alert-error"
         th:text="${errorMessage}"></div>

    <div class="card">
        <h1 class="card-title"
            th:text="${isNew} ? 'Neuen Wissenschaftler anlegen' : 'Wissenschaftler bearbeiten'">
            Formular
        </h1>

        <form th:action="@{/admin/scientists/save}"
              th:object="${scientist}"
              method="post"
              novalidate="novalidate">

            <!-- CSRF -->
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />

            <!-- isNew-Flag damit Controller weiß ob neu/bearbeiten -->
            <input type="hidden" name="isNew" th:value="${isNew}" />

            <!-- ID nur bei Bearbeitung mitsenden -->
            <input type="hidden" th:if="${!isNew}" th:field="*{id}" />

            <!-- Benutzername -->
            <div class="form-group">
                <label for="username">Benutzername *</label>
                <input type="text" id="username" th:field="*{username}"
                       placeholder="z.B. mueller_hans"
                       required="required" />
            </div>

            <!-- Passwort (separates Feld, NICHT th:field damit kein Hash angezeigt wird) -->
            <div class="form-group">
                <label for="rawPassword"
                       th:text="${isNew} ? 'Passwort *' : 'Neues Passwort'">
                    Passwort
                </label>
                <input type="password" id="rawPassword" name="rawPassword"
                       th:placeholder="${isNew}
                           ? 'Passwort eingeben'
                           : 'Leer lassen = Passwort unverändert'" />
                <p class="hint" th:if="${!isNew}">
                    Nur ausfüllen wenn das Passwort geändert werden soll.
                </p>
            </div>

            <!-- Rolle -->
            <div class="form-group">
                <label for="role">Rolle *</label>
                <select id="role" th:field="*{role}">
                    <option value="ROLE_SCIENTIST">Scientist</option>
                    <option value="ROLE_ADMIN">Admin</option>
                </select>
            </div>

            <!-- Buttons -->
            <div class="form-actions">
                <a th:href="@{/admin/dashboard}" class="btn btn-ghost">
                    Abbrechen
                </a>
                <button type="submit" class="btn btn-primary"
                        th:text="${isNew} ? 'Anlegen' : 'Speichern'">
                    Speichern
                </button>
            </div>

        </form>
    </div>
</main>
</body>
</html>
