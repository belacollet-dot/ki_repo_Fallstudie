<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns="http://www.w3.org/1999/xhtml" lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard – LikeHeroToZero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="true" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&amp;display=swap"
          rel="stylesheet" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg:            #f7f6f2;
            --surface:       #f9f8f5;
            --surface-2:     #fbfbf9;
            --border:        #d4d1ca;
            --divider:       #dcd9d5;
            --text:          #28251d;
            --text-muted:    #7a7974;
            --primary:       #01696f;
            --primary-hover: #0c4e54;
            --danger:        #a12c7b;
            --danger-hover:  #7d1e5e;
            --success-bg:    #d4dfcc;
            --success-text:  #437a22;
            --error-bg:      #e0ced7;
            --error-text:    #a12c7b;
            --radius:        0.5rem;
            --radius-lg:     0.75rem;
            --shadow-sm:     0 1px 3px rgba(0,0,0,.06);
            --shadow-md:     0 4px 12px rgba(0,0,0,.08);
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 1rem;
            background: var(--bg);
            color: var(--text);
            min-height: 100dvh;
        }

        /* ── Header ── */
        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .brand { display: flex; align-items: center; gap: .75rem; }
        .brand svg { color: var(--primary); flex-shrink: 0; }
        .brand-name { font-size: 1.1rem; font-weight: 700; }
        .brand-badge {
            font-size: .75rem;
            background: var(--bg);
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 2px 10px;
        }
        .header-right { display: flex; align-items: center; gap: .75rem; }
        .header-user { font-size: .875rem; color: var(--text-muted); }

        /* ── Buttons ── */
        .btn {
            display: inline-flex; align-items: center; gap: .4rem;
            padding: .5rem 1rem; border-radius: var(--radius);
            font-size: .875rem; font-weight: 500; cursor: pointer;
            border: none; text-decoration: none;
            transition: background 150ms ease, box-shadow 150ms ease;
            white-space: nowrap;
        }
        .btn-primary  { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-ghost    { background: transparent; color: var(--text-muted);
                        border: 1px solid var(--border); }
        .btn-ghost:hover  { background: var(--bg); color: var(--text); }
        .btn-danger   { background: var(--danger); color: #fff; }
        .btn-danger:hover { background: var(--danger-hover); }
        .btn-sm { padding: .3rem .75rem; font-size: .8rem; }

        /* ── Main layout ── */
        .main { max-width: 1200px; margin: 0 auto; padding: 2rem; }

        /* ── Alerts ── */
        .alert {
            padding: .75rem 1rem; border-radius: var(--radius);
            font-size: .875rem; margin-bottom: 1.5rem;
        }
        .alert-success { background: var(--success-bg); color: var(--success-text);
                         border: 1px solid #b8d0a8; }
        .alert-error   { background: var(--error-bg); color: var(--error-text);
                         border: 1px solid #d0b5c4; }

        /* ── Stats ── */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1.25rem 1.5rem;
            box-shadow: var(--shadow-sm);
        }
        .stat-label { font-size: .8rem; color: var(--text-muted); margin-bottom: .4rem; }
        .stat-value { font-size: 2rem; font-weight: 700; color: var(--primary); line-height: 1; }

        /* ── Section header ── */
        .section-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 1.25rem;
        }
        .section-title { font-size: 1.1rem; font-weight: 700; }

        /* ── Table card ── */
        .table-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }
        table { width: 100%; border-collapse: collapse; }
        thead { background: var(--bg); }
        th {
            padding: .65rem 1rem; text-align: left;
            font-size: .8rem; font-weight: 600; color: var(--text-muted);
            border-bottom: 1px solid var(--border); white-space: nowrap;
        }
        td {
            padding: .65rem 1rem; font-size: .875rem;
            border-bottom: 1px solid var(--divider); vertical-align: middle;
        }
        tr:last-child td { border-bottom: none; }
        tbody tr:hover td { background: var(--bg); }

        /* ── Avatar + user cell ── */
        .user-cell { display: flex; align-items: center; gap: .75rem; }
        .avatar {
            width: 32px; height: 32px; border-radius: 50%;
            background: var(--primary); color: #fff;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: .7rem; font-weight: 700; flex-shrink: 0;
        }

        /* ── Badge ── */
        .badge {
            display: inline-flex; align-items: center;
            padding: 2px 10px; border-radius: 999px;
            font-size: .7rem; font-weight: 600;
        }
        .badge-scientist { background: #cedcd8; color: var(--primary); }
        .badge-admin     { background: #e0ced7; color: var(--danger); }

        /* ── Actions ── */
        .actions { display: flex; gap: .4rem; flex-wrap: wrap; }

        /* ── Empty state ── */
        .empty {
            text-align: center; padding: 4rem 2rem;
            color: var(--text-muted);
        }
        .empty svg { margin: 0 auto 1rem; opacity: .35; }
        .empty h3  { color: var(--text); font-size: 1rem; margin-bottom: .4rem; }
        .empty p   { font-size: .875rem; }
    </style>
</head>
<body>

<!-- ── Header ── -->
<header class="header">
    <div class="brand">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
        </svg>
        <span class="brand-name">LikeHeroToZero</span>
        <span class="brand-badge">Admin</span>
    </div>
    <div class="header-right">
        <span class="header-user"
              th:text="${#authentication.name}">admin</span>
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />
            <button type="submit" class="btn btn-ghost btn-sm">Abmelden</button>
        </form>
    </div>
</header>

<!-- ── Main ── -->
<main class="main">

    <!-- Feedback -->
    <div th:if="${successMessage}" class="alert alert-success"
         th:text="${successMessage}"></div>
    <div th:if="${errorMessage}"   class="alert alert-error"
         th:text="${errorMessage}"></div>

    <!-- Stats -->
    <div class="stats">
        <div class="stat-card">
            <div class="stat-label">Wissenschaftler gesamt</div>
            <div class="stat-value" th:text="${scientists.size()}">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Emissionseinträge gesamt</div>
            <div class="stat-value" th:text="${totalEmissions}">0</div>
        </div>
    </div>

    <!-- Tabelle -->
    <div class="section-header">
        <h2 class="section-title">Wissenschaftler verwalten</h2>
        <a th:href="@{/admin/scientists/new}" class="btn btn-primary">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5"  y1="12" x2="19" y2="12"/>
            </svg>
            Neuer Wissenschaftler
        </a>
    </div>

    <div class="table-card">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Benutzer</th>
                    <th>Benutzername</th>
                    <th>Rolle</th>
                    <th>Aktionen</th>
                </tr>
            </thead>
            <tbody>
                <!-- Leer -->
                <tr th:if="${#lists.isEmpty(scientists)}">
                    <td colspan="5">
                        <div class="empty">
                            <svg width="44" height="44" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                                <circle cx="9" cy="7" r="4"/>
                                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                            </svg>
                            <h3>Keine Wissenschaftler vorhanden</h3>
                            <p>Lege den ersten Wissenschaftler an.</p>
                        </div>
                    </td>
                </tr>

                <!-- Zeilen -->
                <tr th:each="s : ${scientists}">
                    <td th:text="${s.id}"
                        style="color:var(--text-muted);font-size:.8rem;"></td>
                    <td>
                        <div class="user-cell">
                            <div class="avatar"
                                 th:text="${#strings.toUpperCase(#strings.substring(s.username,0,1))}">A</div>
                            <span th:text="${s.username}">Name</span>
                        </div>
                    </td>
                    <td th:text="${s.username}" style="color:var(--text-muted);"></td>
                    <td>
                        <span class="badge"
                            th:classappend="${s.role != null and s.role.toString() == 'ADMIN'} ? 'badge-admin' : 'badge-scientist'"
                            th:text="${s.role != null and s.role.toString() == 'ADMIN'} ? 'Admin' : 'Scientist'">
                        </span>
                    </td>

                    <td>
                        <div class="actions">
                            <a th:href="@{/admin/scientists/edit/{id}(id=${s.id})}"
                               class="btn btn-ghost btn-sm">Bearbeiten</a>
                            <form th:action="@{/admin/scientists/delete/{id}(id=${s.id})}"
                                  method="post" style="display:inline;"
                                  onsubmit="return confirm('Wissenschaftler wirklich löschen?')">
                                <input type="hidden"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}" />
                                <button type="submit" class="btn btn-danger btn-sm">
                                    Löschen
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</main>
</body>
</html>
